resume_header_intro: "<p>Abdullah is a data scientist with a bachelor's degree in Statistics and a master's degree in Risk Analysis from Eskişehir Osmangazi University. He specializes in machine learning and deep learning, with particular expertise in time series analysis and forecasting. He competes actively on Kaggle and Zindi, and his research on modelling financial and agricultural commodity prices with LSTM and GARCH models has been presented at international conferences.</p>"

